[project]
name = "samye"
version = "0.1.0"
description = "A self-hosted Google Docs editing collaborator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "httpx>=0.27",
    "pydantic>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
samye = "samye.cli:main"

[project.urls]
Repository = "https://github.com/isaaccastillod/samye"
Issues = "https://github.com/isaaccastillod/samye/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
